<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>রক্ষণাবেক্ষণ চলছে | SmritiLive</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b11;
      --card-bg: rgba(13, 23, 34, 0.88);
      --card-border: rgba(16, 185, 129, 0.22);
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hind Siliguri', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 15%, #08241e 0%, #060b11 75%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient lighting */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }
    .glow-1 {
      width: 240px;
      height: 240px;
      background: #059669;
      top: 15%;
      left: 10%;
    }
    .glow-2 {
      width: 200px;
      height: 200px;
      background: #0284c7;
      bottom: 20%;
      right: 10%;
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 390px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 30px rgba(16, 185, 129, 0.08);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Compact Icon */
    .icon-box {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(5, 150, 105, 0.4));
      border: 1.2px solid rgba(16, 185, 129, 0.4);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .icon-box svg {
      width: 26px;
      height: 26px;
      color: #34d399;
      animation: spin 10s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Compact Pill Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.28);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #6ee7b7;
      margin-bottom: 10px;
      letter-spacing: 0.2px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Compact Title & Text */
    h1 {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p.desc {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding: 0 4px;
    }

    /* Compact Mini Time Pill */
    .time-pill {
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 12.5px;
    }

    .time-pill span.label {
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .time-pill span.value {
      color: #34d399;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
    }

    /* Compact Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.28);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12.5px;
      padding: 8px 12px;
    }

    /* Auto refresh counter */
    .refresh-info {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .spinner {
      width: 10px;
      height: 10px;
      border: 1.5px solid rgba(16, 185, 129, 0.3);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .footer {
      margin-top: 18px;
      font-size: 11.5px;
      color: #64748b;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 390px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="glow-orb glow-1"></div>
  <div class="glow-orb glow-2"></div>

  <div class="card">
    <div class="icon-box">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      <span id="badgeText">আপগ্রেড চলছে</span>
    </div>

    <h1 id="maintTitle">SmritiLive • সিস্টেম আপডেট চলছে</h1>

    <p class="desc" id="maintDesc">
      SmritiLive-কে আরও দ্রুত ও উন্নত করার কাজ চলছে। কিছুক্ষণের মধ্যেই সিস্টেমটি পুরোপুরি সচল হবে।
    </p>

    <div class="time-pill">
      <span class="label">
        <svg style="width: 14px; height: 14px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        আনুমানিক সময়
      </span>
      <span class="value" id="maintTime">১৫ - ২০ মিনিট</span>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="checkStatus(true)">
        <svg style="width: 15px; height: 15px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        পুনরায় চেক করুন
      </button>

      <a class="btn btn-secondary" href="https://wa.me/8801700000000" target="_blank" rel="noopener">
        <svg style="width: 15px; height: 15px; color: #25D366;" fill="currentColor" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
        </svg>
        WhatsApp সাপোর্ট
      </a>
    </div>

    <div class="refresh-info">
      <span class="spinner"></span>
      <span id="countdownText">১৫ সেকেন্ড পর স্বয়ংক্রিয়ভাবে চেক হবে</span>
    </div>
  </div>

  <div class="footer">
    <span>© 2026 SmritiLive • সর্বস্বত্ব সংরক্ষিত</span>
  </div>

  <script>
    let countdown = 15;

    async function checkStatus(isManual = false) {
      const btn = document.querySelector('.btn-primary');
      if (isManual && btn) {
        btn.innerText = 'চেক করা হচ্ছে...';
      }

      try {
        const res = await fetch('/api/maintenance/status', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.success) {
            if (data.isMaintenanceMode === false) {
              window.location.href = '/';
              return;
            }
            if (data.title) document.getElementById('maintTitle').innerText = data.title;
            if (data.message) document.getElementById('maintDesc').innerText = data.message;
            if (data.estimatedTime) document.getElementById('maintTime').innerText = data.estimatedTime;
          }
        }
      } catch (e) {
        // Retrying
      } finally {
        if (isManual && btn) {
          btn.innerHTML = `<svg style="width: 15px; height: 15px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg> পুনরায় চেক করুন`;
        }
      }
    }

    setInterval(() => {
      countdown--;
      const textElem = document.getElementById('countdownText');
      if (textElem) {
        textElem.innerText = `${countdown} সেকেন্ড পর স্বয়ংক্রিয়ভাবে চেক হবে`;
      }
      if (countdown <= 0) {
        countdown = 15;
        checkStatus(false);
      }
    }, 1000);

    checkStatus(false);
  </script>
</body>
</html>
