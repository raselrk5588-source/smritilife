version: '3.8'

services:
  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: smriti_server
    ports:
      - "5000:5000"
    networks:
      - smriti_network

  worker:
    build: 
      context: ./worker
      dockerfile: Dockerfile
    container_name: smriti_worker
    networks:
      - smriti_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smriti_client
    ports:
      - "5173:80"
    networks:
      - smriti_network

networks:
  smriti_network:
    driver: bridge
