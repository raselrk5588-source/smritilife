version: '3.8'

services:
  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: smriti_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - smriti_network

  worker:
    build: 
      context: ./worker
      dockerfile: Dockerfile
    container_name: smriti_worker
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - smriti_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smriti_client
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - smriti_network

networks:
  smriti_network:
    driver: bridge
