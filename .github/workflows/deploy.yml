name: Deploy to VPS

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /var/www/roni/smritilife.com
            cd /var/www/roni/smritilife.com
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/raselrk5588-source/smritilife.git
            fi
            git config --global --add safe.directory /var/www/roni/smritilife.com
            git fetch origin
            git branch -f ${{ github.ref_name }} origin/${{ github.ref_name }} || true
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd
            
            # Create .env.production for client so Vite can pick up VITE_API_URL during build
            echo "VITE_API_URL=https://smritilife.com/api" > client/.env.production

            # Create .env for server
            echo "PORT=5000" > server/.env
            echo "MONGO_URI=mongodb+srv://qubitzonebd_db_user:18UHT5Vf531QhuRd@cluster0.f1jgl4t.mongodb.net/smriti?appName=Cluster0" >> server/.env
            echo "JWT_SECRET=smriti_secret_key_2026" >> server/.env
            echo "NODE_ENV=production" >> server/.env
            
            # AI & WhatsApp Settings
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> server/.env
            echo "WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" >> server/.env
            echo "WHATSAPP_BUSINESS_ACCOUNT_ID=${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}" >> server/.env
            echo "WHATSAPP_ACCESS_TOKEN=${{ secrets.WHATSAPP_ACCESS_TOKEN }}" >> server/.env
            echo "WHATSAPP_VERIFY_TOKEN=smriti_whatsapp_verify_token_2026" >> server/.env

            # Create .env for worker
            echo "PORT=5001" > worker/.env
            echo "MONGO_URI=mongodb+srv://qubitzonebd_db_user:18UHT5Vf531QhuRd@cluster0.f1jgl4t.mongodb.net/smriti?appName=Cluster0" >> worker/.env
            echo "REDIS_HOST=close-bee-199444.upstash.io" >> worker/.env
            echo "REDIS_PORT=6379" >> worker/.env
            echo "REDIS_PASSWORD=gQAAAAAAAwsUAAIgcDEyMTYzZTlkNmVjZWY0MWViOGQzNjBiNDA4NTJkNzc1MA" >> worker/.env
            
            docker-compose down
            docker-compose up -d --build
            
            echo "Configuring Nginx Reverse Proxy..."
            sudo bash -c 'cat > /etc/nginx/sites-available/smritilife.com << "EOF"
            server {
                listen 80;
                server_name smritilife.com www.smritilife.com;

                location / {
                    proxy_pass http://127.0.0.1:5173;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                }

                location /api {
                    proxy_pass http://127.0.0.1:5000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            EOF'
            
            sudo ln -sf /etc/nginx/sites-available/smritilife.com /etc/nginx/sites-enabled/
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "Configuring SSL Certificate..."
            sudo certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email -d smritilife.com -d www.smritilife.com || true
