name: Deploy to VPS

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /var/www/roni/smritilife.com
            cd /var/www/roni/smritilife.com
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/raselrk5588-source/smritilife.git
            fi
            git config --global --add safe.directory /var/www/roni/smritilife.com
            git fetch origin
            git branch -f ${{ github.ref_name }} origin/${{ github.ref_name }} || true
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd
            
            # Create .env.production for client so Vite can pick up VITE_API_URL during build
            echo "VITE_API_URL=https://smritilife.com/api" > client/.env.production

            # Create .env for server
            echo "PORT=5000" > server/.env
            echo "MONGO_URI=mongodb+srv://qubitzonebd_db_user:18UHT5Vf531QhuRd@cluster0.f1jgl4t.mongodb.net/smriti?appName=Cluster0" >> server/.env
            echo "JWT_SECRET=smriti_secret_key_2026" >> server/.env
            echo "NODE_ENV=production" >> server/.env
            
            # AI & WhatsApp Settings
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> server/.env
            echo "WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" >> server/.env
            echo "WHATSAPP_BUSINESS_ACCOUNT_ID=${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}" >> server/.env
            echo "WHATSAPP_ACCESS_TOKEN=${{ secrets.WHATSAPP_ACCESS_TOKEN }}" >> server/.env
            echo "WHATSAPP_VERIFY_TOKEN=smriti_whatsapp_verify_token_2026" >> server/.env
            echo "MESSENGER_VERIFY_TOKEN=smriti_messenger_webhook_2026" >> server/.env
            echo "META_APP_ID=2191632625092747" >> server/.env
            echo "META_APP_SECRET=af04beeee2b5ff112a9baf1fd06e63b8" >> server/.env
            echo "FB_APP_ID=2191632625092747" >> server/.env
            echo "FB_APP_SECRET=af04beeee2b5ff112a9baf1fd06e63b8" >> server/.env
            echo "FB_REDIRECT_URI=https://smritilife.com/api/fcommerce/oauth/callback" >> server/.env

            # Create .env for worker
            echo "PORT=5001" > worker/.env
            echo "MONGO_URI=mongodb+srv://qubitzonebd_db_user:18UHT5Vf531QhuRd@cluster0.f1jgl4t.mongodb.net/smriti?appName=Cluster0" >> worker/.env
            echo "REDIS_HOST=close-bee-199444.upstash.io" >> worker/.env
            echo "REDIS_PORT=6379" >> worker/.env
            echo "REDIS_PASSWORD=gQAAAAAAAwsUAAIgcDEyMTYzZTlkNmVjZWY0MWViOGQzNjBiNDA4NTJkNzc1MA" >> worker/.env
            echo "WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" >> worker/.env
            echo "WHATSAPP_ACCESS_TOKEN=${{ secrets.WHATSAPP_ACCESS_TOKEN }}" >> worker/.env
            
            # Ensure Swap is enabled on VPS to prevent Docker OOM killer during build
            if [ ! -f /swapfile ] && [ $(free -m | awk '/^Swap:/ {print $2}') -eq 0 ]; then
              echo "Configuring 2GB swap space for stable builds..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
            fi

            # Clean unused images to prevent disk full issues
            docker system prune -f || true

            # Determine docker compose command (supports compose v2 plugin and classic v1)
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi
            echo "Using Compose command: $COMPOSE_CMD"

            # Prepare static maintenance page for Nginx custom 502 error fallback
            mkdir -p /var/www/roni/smritilife.com/static
            cp client/public/maintenance.html /var/www/roni/smritilife.com/static/maintenance.html || true

            # Build images first so running containers stay alive during build
            $COMPOSE_CMD build --parallel || $COMPOSE_CMD build
            $COMPOSE_CMD up -d --remove-orphans
            
            # Print running containers and check status
            $COMPOSE_CMD ps
            $COMPOSE_CMD logs --tail=30

            echo "Configuring Nginx Reverse Proxy with Custom Maintenance Fallback..."
            sudo bash -c 'cat > /etc/nginx/sites-available/smritilife.com << "EOF"
            server {
                listen 80;
                server_name smritilife.com www.smritilife.com;

                # Enable Gzip Compression for 3x-4x faster asset delivery
                gzip on;
                gzip_vary on;
                gzip_proxied any;
                gzip_comp_level 6;
                gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

                # Custom branded maintenance page for 502/503/504 errors on website
                error_page 502 503 504 /maintenance.html;
                location = /maintenance.html {
                    root /var/www/roni/smritilife.com/static;
                    internal;
                }

                location / {
                    proxy_pass http://127.0.0.1:5173;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                    proxy_intercept_errors on;
                }

                location /api {
                    proxy_pass http://127.0.0.1:5000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            EOF'
            
            sudo ln -sf /etc/nginx/sites-available/smritilife.com /etc/nginx/sites-enabled/
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "Configuring SSL Certificate..."
            sudo certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email -d smritilife.com -d www.smritilife.com || true
